name: Testes

on:
  push:
    branches: [main, master, develop, 'feature/**', 'fix/**', 'docs/**', 'chore/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: API, painel e documentação
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            revive-painel/package-lock.json
      - name: Instalar dependências da API
        run: npm ci
      - name: Instalar dependências do painel
        run: npm ci --prefix revive-painel
      - name: Auditar dependências da API e do painel
        run: |
          npm run audit:tooling
          npm run audit:tooling --prefix revive-painel
      - name: Validar API, painel, documentação e build
        run: npm run validate

  mobile:
    name: Mobile — tipos, lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: revive-mobile
    env:
      CI: 'true'
      EXPO_PUBLIC_API_URL: https://revive-tests.invalid/api
      EXPO_PUBLIC_APP_ENV: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: revive-mobile/package-lock.json
      - name: Instalar dependências do mobile
        run: npm ci
      - name: Validar tipos, lint e testes
        run: npm run validate
