name: Testes

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'docs/**'
      - 'chore/**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            revive-painel/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Install panel dependencies
        run: npm ci
        working-directory: revive-painel

      - name: API unit tests
        run: npm run test:api:unit

      - name: API integration tests
        run: npm run test:api:integration

      - name: Panel unit tests
        run: npm run test:web:unit

      - name: Panel integration tests
        run: npm run test:web:integration

      - name: Panel production build
        run: npm run build:web
