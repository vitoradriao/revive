name: Testes

on:
  push:
    branches: [main, master, develop, 'feature/**', 'fix/**', 'docs/**', 'chore/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: API, painel e documentação
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            revive-painel/package-lock.json
      - name: Instalar dependências da API
        run: npm ci
      - name: Instalar dependências do painel
        run: npm ci --prefix revive-painel
      - name: Auditar dependências da API e do painel
        run: |
          npm run audit:tooling
          npm run audit:tooling --prefix revive-painel
      - name: Validar API, painel, documentação e build
        run: npm run validate

  mobile:
    name: Mobile — tipos, lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: revive-mobile
    env:
      CI: 'true'
      EXPO_PUBLIC_API_URL: https://revive-tests.invalid/api
      EXPO_PUBLIC_APP_ENV: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: revive-mobile/package-lock.json
      - name: Instalar dependências do mobile
        run: npm ci
      - name: Validar tipos, lint e testes
        run: npm run validate

  postgres:
    name: PostgreSQL 17 e API real
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências da API
        run: npm ci
      - name: Validar instalação, upgrade, transações e API
        env:
          # Same upstream versions; mirrors avoid shared-runner Docker Hub limits.
          REVIVE_CI_POSTGRES_IMAGE: public.ecr.aws/docker/library/postgres:17.6-alpine
          REVIVE_CI_POSTGREST_IMAGE: mirror.gcr.io/postgrest/postgrest:v12.2.12
          REVIVE_CI_MAILPIT_IMAGE: ghcr.io/axllent/mailpit:v1.31.4
        run: sh supabase/verification/run_ci.sh

  browser:
    name: Web — sessões, IndexedDB e shell offline
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            revive-painel/package-lock.json
      - name: Instalar dependências
        run: |
          npm ci
          npm ci --prefix revive-painel
      - name: Instalar Chromium, Firefox e WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Compilar shell público
        run: npm run build:web
      - name: Validar sessões, IndexedDB, replay e reabertura offline
        shell: bash
        run: |
          node tests/browser/session-fixture.cjs > "$RUNNER_TEMP/revive-browser-api.log" 2>&1 &
          fixture_pid=$!
          REVIVE_API_PROXY_TARGET=http://127.0.0.1:3177 npm run dev --prefix revive-painel -- --host 127.0.0.1 --port 4177 --strictPort > "$RUNNER_TEMP/revive-browser-vite.log" 2>&1 &
          vite_pid=$!
          trap 'kill "$fixture_pid" "$vite_pid" 2>/dev/null || true' EXIT
          node -e 'const pause=()=>new Promise(r=>setTimeout(r,250)); (async()=>{for(let n=0;n<120;n++){try{if((await fetch("http://127.0.0.1:4177")).ok && (await fetch("http://127.0.0.1:3177/__test/status")).ok)return}catch{}await pause()}throw Error("Browser fixtures unavailable")})().catch(e=>{console.error(e.message);process.exitCode=1})'
          REVIVE_BROWSER_ARTIFACTS="$RUNNER_TEMP/revive-browser-artifacts" npm run test:browser
      - name: Guardar capturas sintéticas do progresso web
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progresso-web-sintetico
          path: ${{ runner.temp }}/revive-browser-artifacts/progresso-*.png
          if-no-files-found: ignore
