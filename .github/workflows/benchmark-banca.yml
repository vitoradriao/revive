name: Medicao isolada da API
on:
  push:
    branches: [feature/validacao-apk-banca]
    paths: ['.github/workflows/benchmark-banca.yml', 'tests/db/benchmark-review.mjs']
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      REVIVE_CI_POSTGREST_IMAGE: mirror.gcr.io/postgrest/postgrest:v12.2.12
      REVIVE_CI_MAILPIT_IMAGE: ghcr.io/axllent/mailpit:v1.31.4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Executar medicao com PostgreSQL 17.6
        shell: bash
        run: |
          for image in mirror.gcr.io/library/postgres:17.6-alpine public.ecr.aws/docker/library/postgres:17.6-alpine postgres:17.6-alpine; do
            if timeout 90 docker pull "$image"; then export REVIVE_CI_POSTGRES_IMAGE="$image"; break; fi
          done
          test -n "${REVIVE_CI_POSTGRES_IMAGE:-}"
          sh supabase/verification/run_ci.sh
